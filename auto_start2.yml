# Run this tmuxinator profile from inside v2x-gpu-container.
name: v2x_inside_container
root: /ros2_ws

windows:
  - detectors:
      layout: tiled
      panes:
        - source /opt/ros/jazzy/setup.bash && source install/setup.bash && ros2 launch ros2_yolos_cpp detector2.launch.py model_path:=src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_2/image
        - sleep 3 && source /opt/ros/jazzy/setup.bash && source install/setup.bash && ros2 launch ros2_yolos_cpp detector3.launch.py model_path:=src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_3/image
        - sleep 6 && source /opt/ros/jazzy/setup.bash && source install/setup.bash && ros2 launch ros2_yolos_cpp detector4.launch.py model_path:=src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_4/image
        - sleep 12 && source /opt/ros/jazzy/setup.bash && source install/setup.bash && ros2 launch late_fusion_for_yolos_cpp launch_fusion_node.py
