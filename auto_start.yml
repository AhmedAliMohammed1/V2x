name: auto_start
root: ~/

windows:
  - detectors:
      layout: tiled
      panes:
        - pane1:
          - docker start ros2_yolos_gpu_container
          - sleep 3
          - docker exec -it ros2_yolos_gpu_container bash -lc "pkill -f '[r]os2 launch ros2_yolos_cpp detector' || true; pkill -f '[r]os2 launch late_fusion_for_yolos_cpp' || true; pkill -f '[y]olos_detector_node( |$)' || true; pkill -f '[c]omponent_container(_mt)?( |$)' || true; pkill -f '[l]ate_fusion_node( |$)' || true"

        - pane2:
          - sleep 6
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch ros2_yolos_cpp detector2.launch.py model_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_2/image"

        - pane3:
          - sleep 9
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch ros2_yolos_cpp detector3.launch.py model_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_3/image"

        - pane4:
          - sleep 12
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch ros2_yolos_cpp detector4.launch.py model_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_4/image"

        - pane5:
          - sleep 15
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch ros2_yolos_cpp detector5.launch.py model_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_5/image"

        - pane6:
          - sleep 18
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch ros2_yolos_cpp detector1.launch.py model_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/yolov8n.onnx labels_path:=/ros2_ws/src/V2x/ros2_yolos_cpp/coco.names use_gpu:=true publish_debug_image:=true image_topic:=/lucid_vision/camera_1/image"

        - pane7:
          - sleep 25
          - docker exec -it ros2_yolos_gpu_container bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 launch late_fusion_for_yolos_cpp launch_fusion_node.py"
